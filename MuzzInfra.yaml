AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Creates a VPC (10.100.0.0/16) with an Internet Gateway, 2 public subnets and
  2 private subnets spread across two Availability Zones, plus public routing.

Parameters:
  VpcCidrBlock:
    Type: String
    Default: 10.100.0.0/16
    Description: The IPv4 CIDR block for the VPC.
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
    ConstraintDescription: Must be a valid IPv4 CIDR block (e.g. 10.100.0.0/16).

  VpcName:
    Type: String
    Default: MuzzInfra-VPC
    Description: Name tag applied to the VPC.

  PublicSubnet1Cidr:
    Type: String
    Default: 10.100.0.0/24
    Description: CIDR block for public subnet 1 (first AZ).

  PublicSubnet2Cidr:
    Type: String
    Default: 10.100.1.0/24
    Description: CIDR block for public subnet 2 (second AZ).

  PrivateSubnet1Cidr:
    Type: String
    Default: 10.100.10.0/24
    Description: CIDR block for private subnet 1 (first AZ).

  PrivateSubnet2Cidr:
    Type: String
    Default: 10.100.11.0/24
    Description: CIDR block for private subnet 2 (second AZ).

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock:
        Ref: VpcCidrBlock
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value:
            Ref: VpcName

  # --- Internet Gateway ---
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value:
            Fn::Sub: '${VpcName}-igw'

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId:
        Ref: Vpc
      InternetGatewayId:
        Ref: InternetGateway

  # --- Public Subnets ---
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock:
        Ref: PublicSubnet1Cidr
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: '${VpcName}-public-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock:
        Ref: PublicSubnet2Cidr
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value:
            Fn::Sub: '${VpcName}-public-2'

  # --- Private Subnets ---
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock:
        Ref: PrivateSubnet1Cidr
      AvailabilityZone:
        Fn::Select:
          - 0
          - Fn::GetAZs: ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value:
            Fn::Sub: '${VpcName}-private-1'

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId:
        Ref: Vpc
      CidrBlock:
        Ref: PrivateSubnet2Cidr
      AvailabilityZone:
        Fn::Select:
          - 1
          - Fn::GetAZs: ''
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value:
            Fn::Sub: '${VpcName}-private-2'

  # --- Public Routing ---
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: Vpc
      Tags:
        - Key: Name
          Value:
            Fn::Sub: '${VpcName}-public-rt'

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId:
        Ref: PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId:
        Ref: InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PublicSubnet1
      RouteTableId:
        Ref: PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PublicSubnet2
      RouteTableId:
        Ref: PublicRouteTable

  # --- Private Routing (local only; no NAT gateway) ---
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId:
        Ref: Vpc
      Tags:
        - Key: Name
          Value:
            Fn::Sub: '${VpcName}-private-rt'

  PrivateSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PrivateSubnet1
      RouteTableId:
        Ref: PrivateRouteTable

  PrivateSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId:
        Ref: PrivateSubnet2
      RouteTableId:
        Ref: PrivateRouteTable

Outputs:
  VpcId:
    Description: The ID of the created VPC.
    Value:
      Ref: Vpc
    Export:
      Name:
        Fn::Sub: '${AWS::StackName}-VpcId'

  VpcCidr:
    Description: The IPv4 CIDR block assigned to the VPC.
    Value:
      Fn::GetAtt:
        - Vpc
        - CidrBlock
    Export:
      Name:
        Fn::Sub: '${AWS::StackName}-VpcCidr'

  PublicSubnet1Id:
    Description: The ID of public subnet 1.
    Value:
      Ref: PublicSubnet1
    Export:
      Name:
        Fn::Sub: '${AWS::StackName}-PublicSubnet1Id'

  PublicSubnet2Id:
    Description: The ID of public subnet 2.
    Value:
      Ref: PublicSubnet2
    Export:
      Name:
        Fn::Sub: '${AWS::StackName}-PublicSubnet2Id'

  PrivateSubnet1Id:
    Description: The ID of private subnet 1.
    Value:
      Ref: PrivateSubnet1
    Export:
      Name:
        Fn::Sub: '${AWS::StackName}-PrivateSubnet1Id'

  PrivateSubnet2Id:
    Description: The ID of private subnet 2.
    Value:
      Ref: PrivateSubnet2
    Export:
      Name:
        Fn::Sub: '${AWS::StackName}-PrivateSubnet2Id'

  InternetGatewayId:
    Description: The ID of the Internet Gateway.
    Value:
      Ref: InternetGateway
    Export:
      Name:
        Fn::Sub: '${AWS::StackName}-InternetGatewayId'
